# Dovecot 2.3 – generiert aus Template beim Containerstart

protocols = imap lmtp sieve
listen = *, ::
log_path = /dev/stderr
info_log_path = /dev/stdout

# ---------------------------------------------------------------- TLS
ssl = required
ssl_cert = </certs/fullchain.pem
ssl_key = </certs/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# ---------------------------------------------------------------- Auth (LDAP)
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu

passdb {
  driver = ldap
  args = /etc/dovecot/dovecot-ldap.conf.ext
}

# Alle Postfächer gehören dem Systembenutzer vmail. Die Existenz prüft
# Postfix bereits per LDAP. Die SQLite-Abfrage liefert immer eine Zeile
# und ergänzt nur das Quota-Limit (eigener Wert oder Standard).
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# ---------------------------------------------------------------- Speicher
mail_location = maildir:~/Maildir
mail_plugins = $mail_plugins quota
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

# ---------------------------------------------------------------- Quota
# 'count' führt die Belegung laufend in den Dovecot-Indizes mit –
# kein Durchzählen von Dateien nötig.
plugin {
  quota = count:Postfach
  quota_vsizes = yes
  # Standard, wird per userdb (SQLite) je Postfach überschrieben
  quota_rule = *:storage=${QUOTA_DEFAULT_MB}M
  # Papierkorb darf etwas über das Limit, damit Löschen immer klappt
  quota_rule2 = Trash:storage=+200M
  # Eine Mail darf das Limit noch knapp überschreiten
  quota_grace = 5%%

  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox full / Postfach voll"
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

# ---------------------------------------------------------------- Sieve (Filter + Abwesenheit)
# Skripte liegen im Postfach unter ~/sieve, das aktive ist ~/.dovecot.sieve.
# Die Weboberfläche schreibt ~/sieve/webui.sieve; per ManageSieve (Port 4190)
# können Clients wie Thunderbird eigene Skripte verwalten.
plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve
  # Weiterleitungen mit der Empfängeradresse als Envelope-Absender,
  # damit SPF beim Zielserver nicht scheitert
  sieve_redirect_envelope_from = orig_recipient
  # Abwesenheitsantwort kommt von der Adresse, an die geschrieben wurde
  sieve_vacation_send_from_recipient = yes
  sieve_vacation_min_period = 1d
  sieve_vacation_default_period = 1d
  sieve_max_redirects = 4
}

# ---------------------------------------------------------------- Dienste
service imap-login {
  inet_listener imap {
    port = 0          # unverschlüsseltes IMAP aus
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# Postfix fragt vor der Annahme, ob das Postfach voll ist
# -> volle Postfächer werden direkt beim Einliefern abgelehnt, statt
#    später eine Unzustellbarkeitsnachricht zu erzeugen.
service quota-status {
  executable = quota-status -p postfix
  unix_listener /var/spool/postfix/private/quota-status {
    mode = 0600
    user = postfix
  }
  client_limit = 1
}

# HTTP-API für die Weboberfläche (nur im internen Docker-Netz,
# Port 8080 wird nicht nach außen veröffentlicht)
doveadm_api_key = ${DOVEADM_API_KEY}
service doveadm {
  inet_listener http {
    port = 8080
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@${MAIL_HOSTNAME}
}
