{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto">
  <h1>Anmelden</h1>
  <p class="muted" style="margin-top:-8px">{{ mail_hostname }} – mit E-Mail-Adresse und Passwort</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="email" type="email" placeholder="E-Mail-Adresse" required autofocus style="width:100%"></p>
    <p><input name="password" type="password" placeholder="Passwort" required style="width:100%"></p>
    <button class="primary" style="width:100%">Anmelden</button>
  </form>
</div>
{% endblock %}
